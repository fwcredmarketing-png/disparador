# Gera o instalador do Windows e publica no GitHub Releases
# sempre que uma tag de versão (ex: v1.0.1) é enviada.
# Os computadores com o sistema instalado baixam a atualização sozinhos.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build e publicação
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
