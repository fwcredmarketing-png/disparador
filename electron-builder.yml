appId: com.interno.sistemadisparo
productName: Sistema de Disparo
copyright: Uso interno

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json
  - "!**/*.map"

npmRebuild: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: SistemaDeDisparo-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Sistema de Disparo

# ===== ATUALIZAÇÃO AUTOMÁTICA =====
# As versões são publicadas em GitHub Releases deste repositório (público)
# e o app instalado baixa sozinho. Nunca coloque senhas ou tokens neste arquivo.
publish:
  provider: github
  owner: fwcredmarketing-png
  repo: disparador
  releaseType: release
